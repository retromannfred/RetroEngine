name: Auto-labeling issues
on:
  issues:
    types: [opened, edited]

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Sync labels from dropdowns
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = context.payload.issue.title || "";
            const body = context.payload.issue.body || "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            // === Values mapping → labels ===
            const scopes = {
              "Core":     "🧩 scope: core",
              "Graphics": "🧩 scope: graphics",
              "Audio":    "🧩 scope: audio",
              "Physics":  "🧩 scope: physics",
              "Buddies":  "🧩 scope: buddies"
            };

            const types = {
              "New feature":              "🛠 type: feature",
              "Enhancement of a feature": "🛠 type: enhancement",
              "Code refactor":            "🛠 type: refactor",
              "Quality assurance":        "🛠 type: test",
              "Add documentation":        "🛠 type: documentation",
            };

            const priorities = {
              "New feature":              "🚦 priority: medium",
              "Enhancement of a feature": "🚦 priority: low",
              "Code refactor":            "🚦 priority: low",
              "Quality assurance":        "🚦 priority: low",
              "Add documentation":        "🚦 priority: low"
            };
            
            // === Function to extract a block section from body ===
            function extract(sectionTitle) {
              const regex = new RegExp(`${sectionTitle}\\s*\\n([^\\n]+)`);
              const match = body.match(regex);
              return match ? match[1].split(",").map(s => s.trim()) : [];
            }

            // === Form sections ===
            const selectedScopes = extract("Improved scopes");
            const selectedTypes = extract("Select level of improvement");
            const selectedPriorities = extract("Select level of improvement");

            // === Desired labels ===
            const desired = [
              ...selectedScopes.map(s => scopes[s]).filter(Boolean),
              ...selectedTypes.map(s => types[s]).filter(Boolean),
              ...selectedPriorities.map(s => priorities[s]).filter(Boolean)
            ];

            // === Current issue labels ===
            const { data: current } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number });
            const currentLabels = current.map(l => l.name);

            // Filter only categories that we manage here
            const managedPrefixes = ["🧩 scope: ", "🛠 type: ", "🚦 priority: "];
            const currentManaged = currentLabels.filter(n =>
              managedPrefixes.some(prefix => n.startsWith(prefix))
            );

            // === Differences calculation ===
            const toAdd = desired.filter(n => !currentManaged.includes(n));
            const toRemove = currentManaged.filter(n => !desired.includes(n));

            // === Remove not used labels ===
            for (const name of toRemove) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name }).catch(() => {});
            }

            // === Add remaining labes ===
            if (toAdd.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: toAdd });
            }
            
            // === Asignee issue to creator only if it is a task ===
            if (title.startsWith("Task: ")) {
              const assignee = context.actor; // autor de la issue
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number,
                assignees: [assignee]
              });
            }
