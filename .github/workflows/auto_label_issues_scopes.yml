name: Auto-labeling issues - Scopes
on:
  issues:
    types: [opened, edited]

jobs:
  sync-scope-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Sync scope labels from dropdown
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.issue.body || "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            // Mapeo: valor del dropdown → etiqueta en GitHub
            const scopes = {
              "Core":     "🧩 scope: core",
              "Graphics": "🧩 scope: graphics",
              "Audio":    "🧩 scope: audio",
              "Physics":  "🧩 scope: physics",
              "Buddies":  "🧩 scope: buddies"
            };

            // Buscar la sección "Improved scopes" en el body
            const match = body.match(/Improved scopes\s*\n([^\n]+)/);
            const selected = match ? match[1].split(",").map(s => s.trim()) : [];

            // Labels que deberían aplicarse
            const desired = selected
              .map(scope => scopes[scope])
              .filter(Boolean);

            // Labels ya aplicados que son de scope
            const { data: current } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number });
            const currentScope = current.map(l => l.name).filter(n => n.startsWith("🧩 scope: "));

            // Calcular diferencias
            const toAdd = desired.filter(n => !currentScope.includes(n));
            const toRemove = currentScope.filter(n => !desired.includes(n));

            // Quitar los que ya no apliquen
            for (const name of toRemove) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name }).catch(() => {});
            }

            // Añadir los nuevos
            if (toAdd.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: toAdd });
            }