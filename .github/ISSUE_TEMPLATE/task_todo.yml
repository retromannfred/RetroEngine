name: Task to do
description: Adds a simple task to do in the project.
title: "Task: "
labels: ["⏳ status: pending"]
body:
  - type: dropdown
    id: feature-type
    attributes:
      label: Select level of improvement
      description: Is it a new feature or is it an enhancement?
      multiple: false
      options:
        - "Enhancement of a feature"
        - "Code refactor"
        - "Quality assurance"
        - "Add documentation"
    validations:
      required: true
  - type: textarea
    id: feature-description
    attributes:
      label: Description
      description: Describe the functionality you want to propose.
      placeholder: I want to propose...
    validations:
      required: true
  - type: textarea
    id: feature-reason
    attributes:
      label: Justification
      description: Why this feature is useful or why is nice to have?
      placeholder: This feature is useful because...
    validations:
      required: true
  - type: dropdown
    id: feature-scopes
    attributes:
      label: Improved scopes
      description: Select the libraries that will improve with this feature.
      multiple: true
      options:
        - "Core"
        - "Graphics"
        - "Audio"
        - "Physics"
        - "Buddies"
    validations:
      required: false