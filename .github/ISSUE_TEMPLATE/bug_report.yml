name: Bug report
description: Report of a bug in the code.
title: "Bug: "
labels: ["🛠 type: bug", "⏳ status: pending", "🚦 priority: need triage"]
assignees:
  - retromannfred
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what is happening or what is the current behaviour of the engine.
      placeholder: The code is...
    validations:
      required: true
  - type: textarea
    id: how-should-work
    attributes:
      label: How it should work?
      description: Describe how actually should work or how the current behaviour of the engine should be.
      placeholder: The code should...
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How it can be reproduced?
      description: Explain how the bug can be reproducen in a run.
      placeholder: The steps are...
    validations:
      required: true
  - type: dropdown
    id: feature-scopes
    attributes:
      label: Improved scopes
      description: Select the libraries that will improve with this feature.
      multiple: true
      options:
        - "Core"
        - "Graphics"
        - "Audio"
        - "Physics"
        - "Buddies"
    validations:
      required: false